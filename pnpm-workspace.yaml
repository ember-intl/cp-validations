allowBuilds:
  core-js: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@ember-intl/utils"
  - "@ember-intl/v1-compat"
  - "@ijlee2-frontend-configs/*"
  - "ember-intl"
  - "ember-testem"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"

verifyDepsBeforeRun: "warn"
