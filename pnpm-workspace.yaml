allowBuilds:
  core-js: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ember-intl/utils"
  - "@ember-intl/v1-compat"
  - "@ijlee2-frontend-configs/*"
  - "ember-intl"
  - "ember-testem"

verifyDepsBeforeRun: "warn"
